name: 교회 공지 등록
description: 관리위원회 공유 페이지에 공개할 공지를 등록합니다.
title: "[공지] "
labels:
  - notice
body:
  - type: markdown
    attributes:
      value: |
        등록한 공지는 공유 페이지에 공개됩니다. 연락처, 주소 등 개인정보는 적지 마세요.
  - type: dropdown
    id: category
    attributes:
      label: 공지 종류
      options:
        - 회의 안내
        - 시설 점검
        - 봉사 일정
        - 기타
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 일정 또는 게시 종료일
      description: 해당 날짜가 없으면 비워 두어도 됩니다.
      placeholder: 예) 2026년 12월 6일 오후 2시
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: 공지 내용
      description: 일시, 장소, 준비물, 문의 방법 등 공유할 내용을 적어 주세요.
      placeholder: 공지 내용을 입력해 주세요.
    validations:
      required: true
